<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Backend Tester</title>
    <!-- We load Tailwind CSS to make it look nice -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MUST HAVE: The official Razorpay checkout script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Test Razorpay Flow</h2>

        <div class="space-y-4">
            <!-- 1. Input for Razorpay Key ID -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Razorpay Test Key ID</label>
                <input type="text" id="rzpKey" placeholder="rzp_test_..." class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <!-- 2. Input for JWT Token -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your User Token (JWT)</label>
                <input type="text" id="userToken" placeholder="eyJhbG..." class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <!-- 3. Input for Course ID -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Course ID</label>
                <input type="text" id="courseId" value="6a67773708a67fc12e42702a" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <button id="payButton" onclick="startPayment()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg mt-4 transition-colors">
                Test Payment Flow
            </button>

            <div id="statusMessage" class="text-center font-medium text-sm mt-4 hidden"></div>
        </div>
    </div>

    <script>
        async function startPayment() {
            const rzpKey = document.getElementById('rzpKey').value.trim();
            const token = document.getElementById('userToken').value.trim();
            const courseId = document.getElementById('courseId').value.trim();
            const statusDiv = document.getElementById('statusMessage');
            const payButton = document.getElementById('payButton');

            if (!rzpKey || !token || !courseId) {
                showStatus("Please fill in all fields!", "text-red-600");
                return;
            }

            try {
                payButton.disabled = true;
                payButton.innerText = "Creating Order...";
                showStatus("Contacting your backend (/create-order)...", "text-blue-600");

                // STEP 1: Call your backend to create the order
                const orderResponse = await fetch('http://localhost:3000/payment/create-order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'token': token // Your user middleware needs this!
                    },
                    body: JSON.stringify({ courseId: courseId })
                });

                const orderData = await orderResponse.json();

                if (!orderResponse.ok) {
                    throw new Error(orderData.message || orderData.error || "Failed to create order");
                }

                showStatus("Order created! Opening Razorpay...", "text-blue-600");

                // STEP 2: Configure and open Razorpay
                const options = {
                    key: rzpKey, 
                    amount: orderData.order.amount,
                    currency: "INR",
                    name: "Test Course Purchase",
                    order_id: orderData.order.id,
                    
                    // STEP 3: This runs automatically when the user pays successfully
                    handler: async function (response) {
                        showStatus("Payment successful! Verifying with backend...", "text-yellow-600");
                        
                        try {
                            const verifyResponse = await fetch('http://localhost:3000/payment/verify', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'token': token
                                },
                                body: JSON.stringify({
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature,
                                    courseId: courseId
                                })
                            });

                            const verifyData = await verifyResponse.json();
                            
                            if (verifyResponse.ok) {
                                showStatus("✅ Backend verified payment! Course unlocked.", "text-green-600");
                            } else {
                                throw new Error(verifyData.message || "Verification failed");
                            }
                        } catch (err) {
                            showStatus("❌ Verification Error: " + err.message, "text-red-600");
                        }
                    },
                    theme: { color: "#2563EB" }
                };

                const rzp = new window.Razorpay(options);
                
                rzp.on('payment.failed', function (response) {
                    showStatus("❌ Payment failed or cancelled.", "text-red-600");
                });

                rzp.open();

            } catch (error) {
                showStatus("❌ Error: " + error.message, "text-red-600");
            } finally {
                payButton.disabled = false;
                payButton.innerText = "Test Payment Flow";
            }
        }

        function showStatus(message, colorClass) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `text-center font-medium text-sm mt-4 block ${colorClass}`;
            statusDiv.innerText = message;
        }
    </script>
</body>
</html>
